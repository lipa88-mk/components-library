name: Deploy Storybook to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

# The default GITHUB_TOKEN cannot deploy Pages. Grant exactly what the
# first-party Pages actions need; this also makes the repo-level
# "Workflow permissions" setting irrelevant for this workflow.
permissions:
    contents: read # actions/checkout
    pages: write # create a Pages deployment
    id-token: write # OIDC token exchanged by actions/deploy-pages

# One Pages deployment at a time; let an in-flight deploy finish rather
# than cancel it (canceling mid-deploy can leave the site half-updated).
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            # puppeteer@24 postinstall downloads Chrome (~150 MB) for the separate
            # Docker visual-test flow — not needed here. Set current + legacy names.
            PUPPETEER_SKIP_DOWNLOAD: 'true'
            PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
            HUSKY: '0' # skip "prepare": "husky" during npm ci in CI
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version-file: .nvmrc # pins Node 20, same as local dev
                  cache: npm # caches ~/.npm keyed on package-lock.json

            - name: Install dependencies
              run: npm ci # reads .npmrc -> legacy-peer-deps honoured

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v6

            - name: Build Storybook
              run: npm run storybook:build # -> storybook-static/

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: storybook-static # action default is _site/, must override

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
